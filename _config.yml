# Site settings
title: "Ricardo Freguglia"
email: "ricardo.freguglia@ufjf.br"
description: "Full Professor — School of Economics, Federal University of Juiz de Fora (UFJF)"
baseurl: ""
url: "https://ricfreg.github.io"

# Social links
github_username: ricfreg
linkedin_username: "linkedin.com/in/ricardo-freguglia-4399a482"
orcid: "https://orcid.org/0000-0002-1355-2272"
lattes: "http://lattes.cnpq.br/1290479848909932"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
header_pages:
  - index.md
  - about.md
  - research.md
  - publications.md
  - teaching.md
  - cv.md

# Appearance
avatar: "images/profile.jpg"
favicon: "images/favicon.ico"

# Collections
collections:
  publications:
    output: true
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Footer
footer:
  links:
    - label: "GitHub"
      url: "https://github.com/ricfreg"
    - label: "CV Lattes"
      url: "http://lattes.cnpq.br/1290479848909932"
    - label: "UFJF"
      url: "https://www.ufjf.br"
