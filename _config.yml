# Site settings
title: "Ricardo Freguglia"
email: "ricardo.freguglia@ufjf.br"
description: "Professor de Economia — Universidade Federal de Juiz de Fora (UFJF)"
baseurl: ""
url: "https://ricfreg.github.io"

# Social links
github_username: ricfreg
linkedin_username: ""
twitter_username: ""
scholar_userid: ""
orcid: ""
lattes: "https://lattes.cnpq.br/SEU_ID_AQUI"

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Navigation
header_pages:
  - index.md
  - about.md
  - research.md
  - publications.md
  - teaching.md
  - cv.md

# Appearance
avatar: "images/profile.jpg"
favicon: "images/favicon.ico"

# Collections
collections:
  publications:
    output: true
  projects:
    output: true

defaults:
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"

# Footer
footer:
  links:
    - label: "GitHub"
      url: "https://github.com/ricfreg"
    - label: "Lattes"
      url: "https://lattes.cnpq.br/SEU_ID_AQUI"
    - label: "UFJF"
      url: "https://www.ufjf.br"
